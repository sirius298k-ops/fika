<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a1a;display:flex;flex-direction:column;
       align-items:center;height:100vh;
       font-family:'Arial',sans-serif;color:#0ff;touch-action:none;overflow:hidden}

  #join-screen{position:fixed;top:0;left:0;width:100%;height:100%;
               display:flex;flex-direction:column;align-items:center;
               justify-content:center;padding:30px;z-index:20;background:#0a0a1a}
  #name-input{background:rgba(255,255,255,0.05);border:1px solid rgba(0,255,255,0.3);
              border-radius:10px;padding:14px 18px;color:#fff;font-size:1.1rem;
              outline:none;width:100%;max-width:280px;text-align:center;margin-bottom:15px}
  #name-input::placeholder{color:rgba(0,255,255,0.3)}
  #start-btn{background:#0ff;color:#0a0a1a;border:none;padding:16px 36px;
             font-size:1.1rem;font-weight:bold;border-radius:10px;cursor:pointer}
  #join-label{font-size:0.8rem;opacity:0.4;margin-bottom:20px}

  .hidden{display:none}

  /* Main layout: flex column, input pinned to bottom */
  #main{width:100%;height:100%;display:flex;flex-direction:column;
        padding:12px 15px;position:relative}

  #status{text-align:center;font-size:0.7rem;opacity:0.35;padding:4px 0}

  /* Mode display — smaller font */
  #mode-display{text-align:center;font-size:0.75rem;padding:6px 10px;
                background:rgba(0,255,255,0.05);border-radius:8px;
                margin:4px 0;opacity:0.8}

  /* Energy button area */
  #energy-section{display:flex;align-items:center;justify-content:center;
                  padding:8px 0;flex:none;height:130px}
  #tap-btn{width:100px;height:100px;border-radius:50%;
           background:radial-gradient(circle,rgba(0,255,255,0.3),rgba(0,255,255,0.05));
           border:2px solid #0ff;box-shadow:0 0 30px rgba(0,255,255,0.2);
           display:flex;align-items:center;justify-content:center;
           font-size:0.65rem;color:#0ff;cursor:pointer;
           transition:transform .1s,box-shadow .1s;user-select:none}
  #tap-btn:active{transform:scale(0.9);box-shadow:0 0 50px rgba(0,255,255,0.6);
                background:radial-gradient(circle,rgba(0,255,255,0.6),rgba(0,255,255,0.1))}
  #tap-label{text-align:center;font-size:0.65rem;opacity:0.35;margin-top:6px}

  /* Emoji reactions */
  #reactions{display:flex;gap:5px;justify-content:center;
             padding:6px 0;flex-wrap:wrap;flex:none}
  .emoji-btn{font-size:2rem;background:rgba(255,255,255,0.03);
             border:1px solid rgba(0,255,255,0.15);
             border-radius:10px;padding:5px 8px;cursor:pointer;
             transition:transform .1s,background .2s}
  .emoji-btn:active{transform:scale(1.3);background:rgba(0,255,255,0.2)}

  /* Rules — small, subtle, fills middle space */
  #rules{flex:1;padding:10px 4px 6px 4px;overflow:hidden}
  .rule-item{font-size:1rem;color:rgba(0,255,255,0.5);
             padding:5px 0;line-height:1.5;text-align:left;
             border-bottom:1px solid rgba(0,255,255,0.06)}
  .rule-item:last-child{border-bottom:none}

  /* Input section — pinned to bottom */
  #input-section{flex:none;padding:8px 0 12px 0;width:100%;
                 border-top:1px solid rgba(0,255,255,0.08)}
  #input-label{color:rgba(0,255,255,0.35);font-size:0.65rem;
               margin-bottom:6px;text-align:center}
  #input-row{display:flex;gap:8px;width:100%}
  #text-input{flex:1;background:rgba(255,255,255,0.05);
              border:1px solid rgba(0,255,255,0.3);
              border-radius:10px;padding:12px 15px;color:#fff;
              font-size:1rem;outline:none}
  #text-input::placeholder{color:rgba(0,255,255,0.3)}
  #send-btn{background:#0ff;color:#0a0a1a;border:none;padding:12px 18px;
            border-radius:10px;font-weight:bold;font-size:0.9rem;cursor:pointer}
</style>
</head>
<body>

<div id="join-screen">
  <div id="join-label">Enter your name to join</div>
  <input id="name-input" type="text" placeholder="Your name..." autocomplete="off">
  <button id="start-btn">JOIN</button>
</div>

<div id="main" class="hidden">

  <div id="status">Connected as <span id="display-name"></span></div>
  <div id="mode-display">🔋 Tap the circle to power up!</div>

  <div id="energy-section">
    <div>
      <div id="tap-btn">⚡ TAP</div>
      <div id="tap-label">tap to add energy</div>
    </div>
  </div>

  <div id="reactions">
    <div class="emoji-btn" data-emoji="👍">👍</div>
    <div class="emoji-btn" data-emoji="🎉">🎉</div>
    <div class="emoji-btn" data-emoji="🔥">🔥</div>
    <div class="emoji-btn" data-emoji="💡">💡</div>
    <div class="emoji-btn" data-emoji="❤️">❤️</div>
    <div class="emoji-btn" data-emoji="😂">😂</div>
    <div class="emoji-btn" data-emoji="🤔">🤔</div>
    <div class="emoji-btn" data-emoji="👏">👏</div>
  </div>

  <!-- Rules fill the middle space -->
  <div id="rules">
    <div class="rule-item">⚡ Tap. Charge. Unlock. </div>
    <div class="rule-item">📝 Type it. You'll Be Heard. </div>
    <div class="rule-item">❓ Ask Anything. Anytime.</div>
    <div class="rule-item">😊 Express more. Type less. </div>
  </div>

  <!-- Input pinned to bottom -->
  <div id="input-section">
    <div id="input-label">Type a word or question</div>
    <div id="input-row">
      <input id="text-input" type="text" placeholder="Type here..." autocomplete="off">
      <button id="send-btn">SEND</button>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, set, push, onDisconnect, get, onValue }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGUS5pDI2Brd5EdZYZYk_N_Ex4G2Enc9Y",
  authDomain: "test1-fika.firebaseapp.com",
  databaseURL: "https://test1-fika-default-rtdb.firebaseio.com",
  projectId: "test1-fika",
  storageBucket: "test1-fika.firebasestorage.app",
  messagingSenderId: "195634513366",
  appId: "1:195634513366:web:08b8afefc1406f7cb1d077",
  measurementId: "G-0LLML02VVQ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const myId = Math.random().toString(36).slice(2,8);
const myRef = ref(db,'players/'+myId);
onDisconnect(myRef).remove();

let myName = '';
let lastTap = 0;
const colors=['#0ff','#f0f','#ff0','#0f0','#f90','#f55','#5ff','#ff5'];

// Listen to screen mode
onValue(ref(db,'screenMode'),snap=>{
  const currentMode=snap.val()||'shake';
  const display=document.getElementById('mode-display');
  const label=document.getElementById('input-label');
  if(!display)return;
  if(currentMode==='wordcloud'){
    display.textContent='📝 Word Cloud — type a word!';
    label.textContent='Enter a word or short phrase';
  } else if(currentMode==='qa'){
    display.textContent='❓ Q&A — ask your question!';
    label.textContent='Type your question';
  } else if(currentMode==='free'){
    display.textContent='💬 Free mode — words & questions welcome';
    label.textContent='Type anything';
  } else {
    display.textContent='🔋 Tap the circle to power up!';
    label.textContent='Tap the energy button above!';
  }
});

// Send text
function sendText(){
  const input=document.getElementById('text-input');
  const text=input.value.trim();
  if(!text)return;
  get(ref(db,'screenMode')).then(snap=>{
    const mode=snap.val()||'shake';
    if(mode==='qa'){
      push(ref(db,'questions'),{text,name:myName,time:Date.now()});
    } else {
      const color=colors[Math.floor(Math.random()*colors.length)];
      push(ref(db,'words'),{text,name:myName,color,time:Date.now()});
    }
  });
  input.value='';
}

document.getElementById('send-btn').addEventListener('click',sendText);
document.getElementById('text-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')sendText();
});

// Emoji reactions
document.querySelectorAll('.emoji-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    push(ref(db,'reactions'),{emoji:btn.dataset.emoji,name:myName,time:Date.now()});
  });
});

// Tap to energize
document.getElementById('tap-btn').addEventListener('click',async()=>{
  if(Date.now()-lastTap<250)return;
  lastTap=Date.now();
  const snap=await get(ref(db,'energy'));
  const cur=snap.val()||0;
  if(cur<100) set(ref(db,'energy'),Math.min(cur+10,100));
});

// Join
document.getElementById('start-btn').addEventListener('click',async()=>{
  myName=document.getElementById('name-input').value.trim();
  if(!myName){ alert('Please enter your name'); return; }

  if(typeof DeviceOrientationEvent!=='undefined'
     && typeof DeviceOrientationEvent.requestPermission==='function'){
    try{await DeviceOrientationEvent.requestPermission();}catch(e){}
  }

  document.getElementById('join-screen').style.display='none';
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('display-name').textContent=myName;

  set(myRef,{x:0,y:0,name:myName});

  window.addEventListener('deviceorientation',e=>{
    let tx=Math.max(-1,Math.min(1,(e.gamma||0)/30));
    let ty=Math.max(-1,Math.min(1,((e.beta||0)-40)/30));
    set(myRef,{x:tx,y:ty,name:myName});
  });
});

document.getElementById('name-input').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('start-btn').click();
});
</script>
</body>
</html>
