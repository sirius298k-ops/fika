<!DOCTYPE html>
<html>
<head>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a1a;overflow:hidden;font-family:'Arial',sans-serif}
  #info{position:fixed;top:20px;left:20px;color:#0ff;font:14px monospace;z-index:10}
  #topic{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
         color:#fff;font:bold 2.5rem Arial;text-align:center;
         text-shadow:0 0 30px #0ff;transition:opacity .6s;opacity:0;z-index:5}
  #topic.show{opacity:1}
  #energy{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);
          width:300px;height:10px;background:#222;border-radius:5px;z-index:5;
          box-shadow:0 0 10px rgba(0,255,255,0.3)}
  #energy-bar{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#f0f);
              border-radius:5px;transition:width .2s}
  #instruction{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
               color:#0ff;font:12px monospace;opacity:.4;z-index:5;text-align:center}
  
  /* Word Cloud */
  #wordcloud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:3}
  .word{position:absolute;color:#fff;font-weight:bold;opacity:0;
        transition:opacity 1s,transform 2s;text-shadow:0 0 10px currentColor}
  .word.show{opacity:1}

  /* Reactions */
  .reaction{position:fixed;font-size:2rem;bottom:-50px;z-index:6;
            animation:floatUp 3s ease-out forwards;pointer-events:none}
  @keyframes floatUp{
    0%{bottom:-50px;opacity:1;transform:scale(1)}
    100%{bottom:110vh;opacity:0;transform:scale(1.5)}
  }

  /* Questions */
  #questions{position:fixed;top:20px;right:20px;width:320px;z-index:8;
             display:flex;flex-direction:column;gap:10px;max-height:80vh;overflow:hidden}
  .question-card{background:rgba(0,255,255,0.08);border:1px solid rgba(0,255,255,0.3);
                 border-radius:10px;padding:14px 18px;color:#fff;font-size:0.95rem;
                 backdrop-filter:blur(5px);animation:slideIn .5s ease-out;
                 box-shadow:0 0 15px rgba(0,255,255,0.1)}
  @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
  .question-card .q-label{color:#0ff;font-size:0.7rem;margin-bottom:6px;opacity:0.7}

  /* Mode indicator */
  #mode-indicator{position:fixed;top:20px;left:50%;transform:translateX(-50%);
                  color:#0ff;font:bold 1rem monospace;z-index:10;opacity:0.6}
</style>
</head>
<body>
<div id="info">Players: <span id="count">0</span></div>
<div id="mode-indicator"></div>
<div id="topic"></div>
<div id="wordcloud"></div>
<div id="questions"></div>
<div id="instruction">→ next | R reboot | 1 wordcloud mode | 2 Q&A mode | 3 free mode</div>
<div id="energy"><div id="energy-bar"></div></div>
<canvas id="c"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, set, onChildAdded, remove }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGUS5pDI2Brd5EdZYZYk_N_Ex4G2Enc9Y",
  authDomain: "test1-fika.firebaseapp.com",
  databaseURL: "https://test1-fika-default-rtdb.firebaseio.com",
  projectId: "test1-fika",
  storageBucket: "test1-fika.firebasestorage.app",
  messagingSenderId: "195634513366",
  appId: "1:195634513366:web:08b8afefc1406f7cb1d077",
  measurementId: "G-0LLML02VVQ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// === AGENDA ===
const agenda = [
  "Welcome to Fika ☕",
  "Digital Twin in Manufacturing",
  "Predictive Maintenance",
  "Open Discussion",
  "Thank you! 🎉"
];
let idx=-1, mode='float';
let forceX=0, forceY=0;
let screenMode='shake'; // shake, wordcloud, qa, free

// === CANVAS ===
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();window.onresize=resize;

const particles=Array.from({length:160},()=>({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,r:Math.random()*3+1
}));

// === FIREBASE LISTENERS ===
// Players tilt
onValue(ref(db,'players'),snap=>{
  const data=snap.val()||{};
  const players=Object.values(data);
  document.getElementById('count').textContent=players.length;
  forceX=0;forceY=0;
  players.forEach(p=>{forceX+=p.x||0;forceY+=p.y||0;});
  forceX/=Math.max(players.length,1);
  forceY/=Math.max(players.length,1);
});

// Energy
onValue(ref(db,'energy'),snap=>{
  const val=snap.val()||0;
  document.getElementById('energy-bar').style.width=val+'%';
  if(val>=100){next();setTimeout(()=>set(ref(db,'energy'),0),500);}
});

// Words (word cloud)
onChildAdded(ref(db,'words'),snap=>{
  const word=snap.val();
  if(!word||!word.text)return;
  showWord(word.text, word.color||'#0ff');
});

// Reactions
onChildAdded(ref(db,'reactions'),snap=>{
  const r=snap.val();
  if(!r)return;
  showReaction(r.emoji);
});

// Questions
onChildAdded(ref(db,'questions'),snap=>{
  const q=snap.val();
  if(!q||!q.text)return;
  showQuestion(q.text);
});

// === SCREEN MODE ===
onValue(ref(db,'screenMode'),snap=>{
  const val=snap.val();
  if(val) screenMode=val;
  document.getElementById('mode-indicator').textContent=
    screenMode==='wordcloud'?'📝 WORD CLOUD MODE':
    screenMode==='qa'?'❓ Q&A MODE':
    screenMode==='free'?'💬 FREE MODE':'🔋 SHAKE TO UNLOCK';
});

// === FUNCTIONS ===
function next(){
  if(idx>=agenda.length-1)return;
  idx++;
  const el=document.getElementById('topic');
  el.classList.remove('show');
  mode='gather';
  setTimeout(()=>{el.textContent=agenda[idx];el.classList.add('show')},300);
  setTimeout(()=>mode='float',1500);
}

function showWord(text, color){
  const el=document.createElement('div');
  el.className='word';
  el.textContent=text;
  el.style.left=Math.random()*70+15+'%';
  el.style.top=Math.random()*60+20+'%';
  el.style.fontSize=(Math.random()*1.5+1.2)+'rem';
  el.style.color=color;
  el.style.transform=`rotate(${Math.random()*20-10}deg)`;
  document.getElementById('wordcloud').appendChild(el);
  setTimeout(()=>el.classList.add('show'),50);
  // Remove after 30s to avoid clutter
  setTimeout(()=>el.remove(),30000);
}

function showReaction(emoji){
  const el=document.createElement('div');
  el.className='reaction';
  el.textContent=emoji;
  el.style.left=Math.random()*80+10+'%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

function showQuestion(text){
  const container=document.getElementById('questions');
  const card=document.createElement('div');
  card.className='question-card';
  card.innerHTML=`<div class="q-label">Anonymous Question</div>${text}`;
  container.appendChild(card);
  // Keep max 5 questions visible
  while(container.children.length>5){container.firstChild.remove();}
}

function reboot(){
  set(ref(db,'energy'),0);
  set(ref(db,'players'),null);
  set(ref(db,'words'),null);
  set(ref(db,'reactions'),null);
  set(ref(db,'questions'),null);
  document.getElementById('count').textContent='0';
  document.getElementById('energy-bar').style.width='0%';
  document.getElementById('wordcloud').innerHTML='';
  document.getElementById('questions').innerHTML='';
  idx=-1;
  const el=document.getElementById('topic');
  el.classList.remove('show');
}

// === DRAW ===
function draw(){
  ctx.fillStyle='rgba(10,10,26,0.12)';
  ctx.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.vx+=forceX*0.15;p.vy+=forceY*0.15;
    if(mode==='gather'){p.vx+=(W/2-p.x)*.004;p.vy+=(H/2-p.y)*.004;}
    p.vx*=.97;p.vy*=.97;p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,255,255,0.7)';ctx.fill();
  });
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=dx*dx+dy*dy;
      if(d<5000){
        ctx.strokeStyle=`rgba(0,255,255,${.3*(1-d/5000)})`;ctx.lineWidth=.5;
        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();

// === KEYBOARD CONTROLS ===
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')next();
  if(e.key==='r'||e.key==='R')reboot();
  if(e.key==='1'){set(ref(db,'screenMode'),'wordcloud');}
  if(e.key==='2'){set(ref(db,'screenMode'),'qa');}
  if(e.key==='3'){set(ref(db,'screenMode'),'free');}
  if(e.key==='0'){set(ref(db,'screenMode'),'shake');}
});
</script>
</body>
</html>
