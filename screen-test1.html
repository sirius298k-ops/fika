<!DOCTYPE html>
<html>
<head>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a1a;overflow:hidden;font-family:'Arial',sans-serif}

#slide{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
         width:55vw;max-width:650px;background:rgba(255,255,255,0.03);
         border:1px solid rgba(0,255,255,0.15);border-radius:20px;
         padding:50px 60px;text-align:center;z-index:2;
         backdrop-filter:blur(5px);box-shadow:0 0 60px rgba(0,255,255,0.05)}
  #slide.no-border{background:transparent;border:none;box-shadow:none;backdrop-filter:none}
  #slide-number{position:absolute;top:20px;right:30px;color:rgba(0,255,255,0.3);
                font:12px monospace}
  #topic{color:#fff;font-size:1.8rem;font-weight:bold;
         text-shadow:0 0 20px rgba(0,255,255,0.3);
         transition:opacity .6s,transform .6s;opacity:0;transform:translateY(20px);line-height:1.5}
  #topic.show{opacity:1;transform:translateY(0)}
  #subtitle{color:rgba(0,255,255,0.6);font-size:1.2rem;margin-top:15px;
            transition:opacity .6s;opacity:0}
  #subtitle.show{opacity:1}

  #info{position:fixed;top:20px;left:30px;color:#0ff;font:13px monospace;z-index:10;opacity:0.6}
  #mode-indicator{position:fixed;top:20px;left:50%;transform:translateX(-50%);
                  color:#0ff;font:bold 0.9rem monospace;z-index:10;opacity:0.5}

  #energy-wrap{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);
               text-align:center;z-index:5}
  #energy-label{color:rgba(0,255,255,0.4);font:11px monospace;margin-bottom:6px}
  #energy{width:250px;height:6px;background:#111;border-radius:3px;
          box-shadow:0 0 10px rgba(0,255,255,0.1)}
  #energy-bar{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#f0f);
              border-radius:3px;transition:width .2s}

  #wordcloud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6}
  .word{position:absolute;color:#fff;font-weight:bold;opacity:0;
        transition:opacity 1s,transform 1.5s;text-shadow:0 0 10px currentColor}
  .word.show{opacity:1}

  .reaction{position:fixed;font-size:2.2rem;bottom:-50px;z-index:20;
            animation:floatUp 3s ease-out forwards;pointer-events:none}
  @keyframes floatUp{
    0%{bottom:-50px;opacity:1;transform:scale(1)}
    100%{bottom:110vh;opacity:0;transform:scale(1.5)}
  }

  #questions{position:fixed;top:80px;right:30px;width:300px;z-index:8;
             display:flex;flex-direction:column;gap:10px;max-height:75vh;overflow:hidden}
  .question-card{background:rgba(0,255,255,0.05);border:1px solid rgba(0,255,255,0.2);
                 border-radius:12px;padding:14px 18px;color:#fff;font-size:0.9rem;
                 backdrop-filter:blur(5px);animation:slideIn .5s ease-out}
  @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
  .question-card .q-label{color:#0ff;font-size:0.65rem;margin-bottom:6px;opacity:0.5;
                           text-transform:uppercase;letter-spacing:1px}

  #instruction{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
               color:rgba(0,255,255,0.25);font:11px monospace;z-index:5}

  #progress{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
            display:flex;gap:6px;z-index:5}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(0,255,255,0.2);
       transition:background .3s,transform .3s}
  .dot.active{background:#0ff;transform:scale(1.4);box-shadow:0 0 10px #0ff}
  .dot.done{background:rgba(0,255,255,0.5)}
</style>
</head>
<body>
<div id="info">Players: <span id="count">0</span></div>
<div id="mode-indicator"></div>

<div id="slide">
  <div id="slide-number"></div>
  <div id="topic"></div>
  <div id="subtitle"></div>
</div>

<div id="progress"></div>
<div id="wordcloud"></div>
<div id="questions"></div>

<div id="energy-wrap">
  <div id="energy-label">COLLECTIVE ENERGY</div>
  <div id="energy"><div id="energy-bar"></div></div>
</div>

<div id="instruction">→ next | ← back | R reboot | 1 wordcloud | 2 Q&A | 3 free | 0 energy</div>

<canvas id="c"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, set, onChildAdded }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAGUS5pDI2Brd5EdZYZYk_N_Ex4G2Enc9Y",
  authDomain: "test1-fika.firebaseapp.com",
  databaseURL: "https://test1-fika-default-rtdb.firebaseio.com",
  projectId: "test1-fika",
  storageBucket: "test1-fika.firebasestorage.app",
  messagingSenderId: "195634513366",
  appId: "1:195634513366:web:08b8afefc1406f7cb1d077",
  measurementId: "G-0LLML02VVQ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const pageLoadTime = Date.now();

// === AGENDA ===
const agenda = [
  { title: "", subtitle: "", blank: true },
  { title: "Welcome to Today's Fika ☕", subtitle: "", blank: false },
  { title: "Meet Our Guest!", subtitle: "Who are you, what do you do — and one fun fact?", blank: false },
  { title: "Welcome! How's Taizhou treating you so far?", subtitle: "", blank: false },
  { title: "How does Lean Digital make autonomy real?", subtitle: "", blank: false },
  { title: "What does IT need to do to make it work", subtitle: "", blank: false },
  { title: "How has AI changed your Monday morning?", subtitle: "", blank: false },
  { title: "What's the most valuable human skill in 2030?", subtitle: "", blank: false },
  { title: "Where could AI act alone — and where could not?", subtitle: "", blank: false },
  { title: "❓ Open Q&A", subtitle: "Ask anything from your phone", blank: false },
  { title: "🎯 Key Takeaways", subtitle: "One word to remember", blank: false },
  { title: "What should Stuart experience in China?", subtitle: "Be Bold", blank: false },
  { title: "Thank you! 🎉", subtitle: "Mr.Stuart, Welcome to China.", blank: false }
];
let idx=-1, mode='float';
let forceX=0, forceY=0;

// Progress dots
const progressEl=document.getElementById('progress');
agenda.forEach(()=>{
  const d=document.createElement('div');
  d.className='dot';
  progressEl.appendChild(d);
});

function updateProgress(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot';
    if(i<idx) d.classList.add('done');
    if(i===idx) d.classList.add('active');
  });
}

// Canvas
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();window.onresize=resize;

const particles=Array.from({length:250},()=>({
  x:Math.random()*innerWidth,y:Math.random()*innerHeight,
  vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,r:Math.random()*2+0.5
}));

// === FIREBASE LISTENERS ===
onValue(ref(db,'players'),snap=>{
  const data=snap.val()||{};
  const players=Object.values(data);
  document.getElementById('count').textContent=players.length;
  forceX=0;forceY=0;
  players.forEach(p=>{forceX+=p.x||0;forceY+=p.y||0;});
  forceX/=Math.max(players.length,1);
  forceY/=Math.max(players.length,1);
});

onValue(ref(db,'energy'),snap=>{
  const val=snap.val()||0;
  document.getElementById('energy-bar').style.width=val+'%';
  if(val>=100){next();setTimeout(()=>set(ref(db,'energy'),0),500);}
});

onChildAdded(ref(db,'words'),snap=>{
  const word=snap.val();
  if(!word||!word.text)return;
  if(word.time && word.time < pageLoadTime) return;
  showWord(word.text, word.color||'#0ff', word.name||'');
});

onChildAdded(ref(db,'reactions'),snap=>{
  const r=snap.val();
  if(!r||!r.emoji)return;
  if(r.time && r.time < pageLoadTime) return;
  showReaction(r.emoji);
});

onChildAdded(ref(db,'questions'),snap=>{
  const q=snap.val();
  if(!q||!q.text)return;
  if(q.time && q.time < pageLoadTime) return;
  showQuestion(q.text, q.name||'Anonymous');
});

onValue(ref(db,'screenMode'),snap=>{
  const val=snap.val()||'shake';
  document.getElementById('mode-indicator').textContent=
    val==='wordcloud'?'📝 WORD CLOUD':
    val==='qa'?'❓ Q&A':
    val==='free'?'💬 FREE':'🔋 ENERGY';
});

// === FUNCTIONS ===
function next(){
  if(idx>=agenda.length-1)return;
  idx++;
  const current=agenda[idx];
  const slideEl=document.getElementById('slide');
  const el=document.getElementById('topic');
  const sub=document.getElementById('subtitle');
  const num=document.getElementById('slide-number');

  el.classList.remove('show');
  sub.classList.remove('show');
  mode='gather';

  // Blank page — hide slide box
  if(current.blank){
    slideEl.classList.add('no-border');
    num.textContent='';
  } else {
    slideEl.classList.remove('no-border');
    num.textContent=(idx)+' / '+(agenda.length-1);
  }

  setTimeout(()=>{
    el.textContent=current.title;
    sub.textContent=current.subtitle;
    if(!current.blank){
      el.classList.add('show');
      if(current.subtitle) sub.classList.add('show');
    }
    updateProgress();
  },400);
  setTimeout(()=>mode='float',1500);
}

function showWord(text, color, name){
  const el=document.createElement('div');
  el.className='word';
  const nameTag=name?` <span style="font-size:0.55em;opacity:0.4">— ${name}</span>`:'';
  el.innerHTML=text+nameTag;
  el.style.left=Math.random()*50+5+'%';
  el.style.top=Math.random()*50+20+'%';
  el.style.fontSize=(Math.random()*1.2+1)+'rem';
  el.style.color=color;
  el.style.transform=`rotate(${Math.random()*16-8}deg)`;
  document.getElementById('wordcloud').appendChild(el);
  setTimeout(()=>el.classList.add('show'),50);
  setTimeout(()=>el.remove(),25000);
}

function showReaction(emoji){
  const el=document.createElement('div');
  el.className='reaction';
  el.textContent=emoji;
  el.style.left=Math.random()*80+10+'%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

function showQuestion(text, name){
  const container=document.getElementById('questions');
  const card=document.createElement('div');
  card.className='question-card';
  card.innerHTML=`<div class="q-label">Question from ${name}</div>${text}`;
  container.appendChild(card);
  while(container.children.length>5){container.firstChild.remove();}
}

function reboot(){
  set(ref(db,'energy'),0);
  set(ref(db,'players'),null);
  set(ref(db,'words'),null);
  set(ref(db,'reactions'),null);
  set(ref(db,'questions'),null);
  document.getElementById('count').textContent='0';
  document.getElementById('energy-bar').style.width='0%';
  document.getElementById('wordcloud').innerHTML='';
  document.getElementById('questions').innerHTML='';
  idx=-1;
  document.getElementById('topic').classList.remove('show');
  document.getElementById('subtitle').classList.remove('show');
  document.getElementById('slide-number').textContent='';
  document.getElementById('slide').classList.remove('no-border');
  updateProgress();
}

// === DRAW ===
function draw(){
  ctx.fillStyle='rgba(10,10,26,0.08)';
  ctx.fillRect(0,0,W,H);
  particles.forEach(p=>{
    p.vx+=forceX*0.08;p.vy+=forceY*0.08;
    if(mode==='gather'){p.vx+=(W/2-p.x)*.002;p.vy+=(H/2-p.y)*.002;}
    p.vx*=.98;p.vy*=.98;p.x+=p.vx;p.y+=p.vy;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,255,255,0.4)';ctx.fill();
  });
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=dx*dx+dy*dy;
      if(d<6000){
        ctx.strokeStyle=`rgba(0,255,255,${.15*(1-d/6000)})`;ctx.lineWidth=.4;
        ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);ctx.stroke();
      }
    }
  }
  requestAnimationFrame(draw);
}
draw();

// === KEYBOARD ===
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft'&&idx>0){idx-=2;next();}
  if(e.key==='r'||e.key==='R')reboot();
  if(e.key==='1')set(ref(db,'screenMode'),'wordcloud');
  if(e.key==='2')set(ref(db,'screenMode'),'qa');
  if(e.key==='3')set(ref(db,'screenMode'),'free');
  if(e.key==='0')set(ref(db,'screenMode'),'shake');
});
</script>
</body>
</html>
