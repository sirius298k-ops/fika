<!DOCTYPE html>
<html>
<head>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a1a;overflow:hidden;font-family:'Arial',sans-serif}

  #slide{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
         width:60vw;max-width:750px;background:rgba(255,255,255,0.03);
         border:1px solid rgba(0,255,255,0.15);border-radius:20px;
         padding:50px 60px;text-align:center;z-index:2;
         backdrop-filter:blur(5px);box-shadow:0 0 60px rgba(0,255,255,0.05)}
  #slide.no-border{background:transparent;border:none;box-shadow:none;backdrop-filter:none}
  #slide-number{position:absolute;top:20px;right:30px;color:rgba(0,255,255,0.3);
                font:12px monospace}
  #topic{color:#fff;font-size:1.6rem;font-weight:bold;
         text-shadow:0 0 20px rgba(0,255,255,0.3);
         transition:opacity .6s,transform .6s;opacity:0;transform:translateY(20px);
         line-height:1.6}
  #topic.show{opacity:1;transform:translateY(0)}
  #subtitle{color:rgba(0,255,255,0.6);font-size:0.95rem;margin-top:20px;
            line-height:1.8;transition:opacity .6s;opacity:0}
  #subtitle.show{opacity:1}

  #info{position:fixed;top:20px;left:30px;color:#0ff;font:13px monospace;z-index:10;opacity:0.6}
  #mode-indicator{position:fixed;top:20px;left:50%;transform:translateX(-50%);
                color:#0ff;font:bold 0.9rem monospace;z-index:10;opacity:0.5}

  #energy-wrap{position:fixed;bottom:50px;left:50%;transform:translateX(-50%);
               text-align:center;z-index:5}
  #energy-label{color:rgba(0,255,255,0.4);font:11px monospace;margin-bottom:6px}
  #energy{width:250px;height:6px;background:#111;border-radius:3px}
  #energy-bar{height:100%;width:0%;background:linear-gradient(90deg,#0ff,#f0f);
              border-radius:3px;transition:width .2s}

  #wordcloud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:6}
  .word{position:absolute;color:#fff;font-weight:bold;opacity:0;
        transition:opacity 1s;text-shadow:0 0 10px currentColor}
  .word.show{opacity:1}

  .reaction{position:fixed;font-size:2.2rem;bottom:-50px;z-index:20;
            animation:floatUp 3s ease-out forwards;pointer-events:none}
  @keyframes floatUp{
    0%{bottom:-50px;opacity:1;transform:scale(1)}
    100%{bottom:110vh;opacity:0;transform:scale(1.5)}
  }

  #questions{position:fixed;top:80px;right:30px;width:300px;z-index:8;
             display:flex;flex-direction:column;gap:10px;max-height:75vh;overflow:hidden}
  .question-card{background:rgba(0,255,255,0.05);border:1px solid rgba(0,255,255,0.2);
                border-radius:12px;padding:14px 18px;color:#fff;font-size:0.9rem;
                backdrop-filter:blur(5px);animation:slideIn .5s ease-out;
                transition:opacity 1s}
  .question-card.fading{opacity:0}
  @keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
  .question-card .q-label{color:#0ff;font-size:0.65rem;margin-bottom:6px;opacity:0.5;
                text-transform:uppercase;letter-spacing:1px}

  #instruction{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);
               color:rgba(0,255,255,0.25);font:11px monospace;z-index:5}

  #progress{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
            display:flex;gap:6px;z-index:5}
  .dot{width:7px;height:7px;border-radius:50%;background:rgba(0,255,255,0.2);
       transition:background .3s,transform .3s}
  .dot.active{background:#0ff;transform:scale(1.4);box-shadow:0 0 10px #0ff}
  .dot.done{background:rgba(0,255,255,0.5)}
</style>
</head>
<body>
<div id="info">Players: <span id="count">0</span></div>
<div id="mode-indicator"></div>

<div id="slide">
  <div id="slide-number"></div>
  <div id="topic"></div>
  <div id="subtitle"></div>
</div>

<div id="progress"></div>
<div id="wordcloud"></div>
<div id="questions"></div>

<div id="energy-wrap">
  <div id="energy-label">COLLECTIVE ENERGY</div>
  <div id="energy"><div id="energy-bar"></div></div>
</div>

<div id="instruction">→ next | ← back | Space shape | R reboot | 1 wordcloud | 2 Q&A | 3 free | 0 energy</div>
<canvas id="c"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import { getDatabase, ref, onValue, set, onChildAdded }
  from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

// === AUDIO ===
const bgAudio = new Audio('bg.mp3');
bgAudio.loop = true;
bgAudio.volume = 0;
const endAudio = new Audio('byef1.mp3');
endAudio.volume = 0;

function fadeAudio(audio, targetVol, duration){
  const steps=30, interval=duration/steps;
  const delta=(targetVol-audio.volume)/steps;
  const timer=setInterval(()=>{
    audio.volume=Math.min(1,Math.max(0,audio.volume+delta));
    if((delta>0&&audio.volume>=targetVol)||(delta<0&&audio.volume<=targetVol)){
      audio.volume=targetVol;
      clearInterval(timer);
      if(targetVol===0)audio.pause();
    }
  },interval);
}

let bgStarted=false;
document.addEventListener('keydown',()=>{
  if(!bgStarted){
    bgStarted=true;
    bgAudio.play().then(()=>fadeAudio(bgAudio,0.5,2000))
      .catch(e=>console.log('bg blocked:',e));
  }
});

// === FIREBASE ===
const firebaseConfig={
  apiKey:"AIzaSyAGUS5pDI2Brd5EdZYZYk_N_Ex4G2Enc9Y",
  authDomain:"test1-fika.firebaseapp.com",
  databaseURL:"https://test1-fika-default-rtdb.firebaseio.com",
  projectId:"test1-fika",
  storageBucket:"test1-fika.firebasestorage.app",
  messagingSenderId:"195634513366",
  appId:"1:195634513366:web:08b8afefc1406f7cb1d077",
  measurementId:"G-0LLML02VVQ"
};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const pageLoadTime=Date.now();

// === AGENDA ===
const agenda=[
  {title:"",subtitle:"",blank:true},
  {title:"Welcome to Today's Fika ☕",subtitle:"",blank:false},
  {title:"Meet Our Guests!",subtitle:"Quick introductions, roles, and a fun fact.",blank:false},
  {title:"Scaling Digital Transformation",subtitle:"What drives success — and what separates scalable transformations from the rest?",blank:false},
  {title:"The Future of Autonomous Manufacturing",subtitle:"How will autonomy evolve, and what stands between digital initiatives and lasting value?",blank:false},
  {title:"AI, Life",subtitle:"How is AI already changing the way we work?",blank:false},
  {title:"The Human Edge in 2030",subtitle:"As AI takes on routine work, which human skill will matter most?",blank:false},
  {title:"AI Agents: Action vs. Control",subtitle:"Where should AI act autonomously, and where must humans stay in control?",blank:false},
  {title:"❓ Open Q&A",subtitle:"Ask anything from your phone!",blank:false},
  {title:"🎯 Key Takeaways",subtitle:"One word to remember",blank:false},
  {title:"Thank you! 🎉",subtitle:"",blank:false}
];

let idx=-1;
let forceX=0,forceY=0;
let attractToSlide=false;

// === SHAPES ===
const shapes=[
  (i,n,W,H)=>({x:Math.random()*W,y:Math.random()*H}),
  (i,n,W,H)=>{
    const angle=(i/n)*Math.PI*8;
    const r=(i/n)*Math.min(W,H)*0.42;
    return{x:W/2+Math.cos(angle)*r,y:H/2+Math.sin(angle)*r};
  },
  (i,n,W,H)=>{
    const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols);
    const col=i%cols,row=Math.floor(i/cols);
    const padX=W*0.08,padY=H*0.08;
    return{x:padX+(col/(cols-1))*(W-padX*2),y:padY+(row/(rows-1))*(H-padY*2)};
  },
  (i,n,W,H)=>{
    const angle=(i/n)*Math.PI*2;
    const spike=i%2===0?Math.min(W,H)*0.4:Math.min(W,H)*0.18;
    return{x:W/2+Math.cos(angle)*spike,y:H/2+Math.sin(angle)*spike};
  },
  (i,n,W,H)=>({x:(i/n)*W,y:H/2+Math.sin((i/n)*Math.PI*6)*H*0.28}),
  (i,n,W,H)=>{
    const angle=(i/n)*Math.PI*2+Math.random()*0.5;
    const r=Math.min(W,H)*(0.08+Math.random()*0.42);
    return{x:W/2+Math.cos(angle)*r,y:H/2+Math.sin(angle)*r};
  },
  (i,n,W,H)=>{
    const t=(i/n)*Math.PI*6,strand=i%2===0?1:-1;
    return{x:(i/n)*W,y:H/2+Math.sin(t)*H*0.25*strand};
  },
  // 7: Heart
  (i,n,W,H)=>{
    const t=(i/n)*Math.PI*2,scale=Math.min(W,H)*0.045;
    return{
      x:W/2+scale*(16*Math.pow(Math.sin(t),3)),
      y:H/2-scale*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
    };
  },
  // 8: Infinity
  (i,n,W,H)=>{
    const t=(i/n)*Math.PI*2,scale=Math.min(W,H)*0.3;
    return{
      x:W/2+scale*(Math.cos(t)/(1+Math.sin(t)*Math.sin(t))),
      y:H/2+scale*(Math.sin(t)*Math.cos(t)/(1+Math.sin(t)*Math.sin(t)))
    };
  },
  (i,n,W,H)=>{
    const angle=(i/n)*Math.PI*2;
    const r=Math.min(W,H)*(0.25+Math.random()*0.12);
    return{x:W/2+Math.cos(angle)*r,y:H/2+Math.sin(angle)*r};
  }
];

let transitioning=false;
let transitionProgress=0;
let transitionFrom=[];
let transitionTo=[];
let shapeTargets=[];  // ← locked shape positions
let flashAlpha=0;
let shapeOffsetX = 0; // gyro offset for entire shape
let shapeOffsetY = 0;
// Progress dots
const progressEl=document.getElementById('progress');
agenda.forEach(()=>{
  const d=document.createElement('div');
  d.className='dot';
  progressEl.appendChild(d);
});

function updateProgress(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot';
    if(i<idx)d.classList.add('done');
    if(i===idx)d.classList.add('active');
  });
}

// Canvas
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;}
resize();
window.onresize=resize;

const N=150;
const particles=Array.from({length:N},()=>({
  x:Math.random()*innerWidth,
  y:Math.random()*innerHeight,
  vx:(Math.random()-.5)*0.6,
  vy:(Math.random()-.5)*0.6,
  r:Math.random()*2+0.5,
  ox:(Math.random()-.5)*18,  // tiny per-particle offset
  oy:(Math.random()-.5)*18
}));

function triggerShapeTransition(){
  const shapeIdx=1+Math.floor(Math.random()*(shapes.length-1));
  transitionFrom=particles.map(p=>({x:p.x,y:p.y}));
  transitionTo=particles.map((p,i)=>shapes[shapeIdx](i,N,W,H));
  shapeTargets=transitionTo.map(t=>({x:t.x,y:t.y}));
  flashAlpha=1.0;
  transitioning=true;
  transitionProgress=0;
  attractToSlide=false;
}

function triggerSpecificShape(shapeIdx){
  transitionFrom=particles.map(p=>({x:p.x,y:p.y}));
  transitionTo=particles.map((p,i)=>shapes[shapeIdx](i,N,W,H));
  shapeTargets=transitionTo.map(t=>({x:t.x,y:t.y}));
  flashAlpha=1.0;
  transitioning=true;
  transitionProgress=0;
  attractToSlide=false;
}

// Firebase listeners
onValue(ref(db,'players'),snap=>{
  const data=snap.val()||{};
  const players=Object.values(data);
  document.getElementById('count').textContent=players.length;
  forceX=0;forceY=0;
  players.forEach(p=>{forceX+=p.x||0;forceY+=p.y||0;});
  forceX/=Math.max(players.length,1);
  forceY/=Math.max(players.length,1);
});

onValue(ref(db,'energy'),snap=>{
  const val=snap.val()||0;
  document.getElementById('energy-bar').style.width=val+'%';
  if(val>=100){next();setTimeout(()=>set(ref(db,'energy'),0),500);}
});

onChildAdded(ref(db,'words'),snap=>{
  const word=snap.val();
  if(!word||!word.text)return;
  if(word.time&&word.time<pageLoadTime)return;
  showWord(word.text,word.color||'#0ff',word.name||'');
});

onChildAdded(ref(db,'reactions'),snap=>{
  const r=snap.val();
  if(!r||!r.emoji)return;
  if(r.time&&r.time<pageLoadTime)return;
  showReaction(r.emoji);
});

onChildAdded(ref(db,'questions'),snap=>{
  const q=snap.val();
  if(!q||!q.text)return;
  if(q.time&&q.time<pageLoadTime)return;
  showQuestion(q.text,q.name||'Anonymous');
});

onValue(ref(db,'screenMode'),snap=>{
  const val=snap.val()||'shake';
  document.getElementById('mode-indicator').textContent=
    val==='wordcloud'?'📝 WORD CLOUD':
    val==='qa'?'❓ Q&A':
    val==='free'?'💬 FREE':'🔋 ENERGY';
});

// === NEXT ===
function next(){
  if(idx>=agenda.length-1)return;
  idx++;
  const current=agenda[idx];
  const slideEl=document.getElementById('slide');
  const el=document.getElementById('topic');
  const sub=document.getElementById('subtitle');

  el.classList.remove('show');
  sub.classList.remove('show');

  if(idx===0){
    triggerSpecificShape(8);
  } else if(current.title.includes('Thank you')){
    triggerSpecificShape(7);
  } else {
    triggerShapeTransition();
  }

  if(current.blank){
    slideEl.classList.add('no-border');
  } else {
    slideEl.classList.remove('no-border');
  }

  setTimeout(()=>{
    el.textContent=current.title;
    sub.textContent=current.subtitle;
    if(!current.blank){
      el.classList.add('show');
      if(current.subtitle)sub.classList.add('show');
    }
    updateProgress();
    // Activate shape-lock mode after transition settles
    setTimeout(()=>{ attractToSlide=true; },1500);

    if(current.title.includes('Thank you')){
      fadeAudio(bgAudio,0,2000);
      endAudio.currentTime=0;
      endAudio.play().then(()=>fadeAudio(endAudio,0.5,2000))
        .catch(e=>console.log('end audio blocked:',e));
    }
  },400);
}

// === HELPERS ===
function showWord(text,color,name){
  const el=document.createElement('div');
  el.className='word';
  const nameTag=name?` <span style="font-size:0.55em;opacity:0.4">— ${name}</span>`:'';
  el.innerHTML=text+nameTag;
  el.style.left=Math.random()*50+5+'%';
  el.style.top=Math.random()*50+20+'%';
  el.style.fontSize=(Math.random()*1.2+1)+'rem';
  el.style.color=color;
  el.style.transform=`rotate(${Math.random()*16-8}deg)`;
  document.getElementById('wordcloud').appendChild(el);
  setTimeout(()=>el.classList.add('show'),50);
  setTimeout(()=>el.remove(),25000);
}

function showReaction(emoji){
  const el=document.createElement('div');
  el.className='reaction';
  el.textContent=emoji;
  el.style.left=Math.random()*80+10+'%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3500);
}

function showQuestion(text,name){
  const container=document.getElementById('questions');
  const card=document.createElement('div');
  card.className='question-card';
  card.innerHTML=`<div class="q-label">Question from ${name}</div>${text}`;
  container.appendChild(card);
  while(container.children.length>5)container.firstChild.remove();
  setTimeout(()=>{
    card.classList.add('fading');
    setTimeout(()=>{if(card.parentNode)card.remove();},1000);
  },20000);
}

function reboot(){
  set(ref(db,'energy'),0);
  set(ref(db,'players'),null);
  set(ref(db,'words'),null);
  set(ref(db,'reactions'),null);
  set(ref(db,'questions'),null);
  document.getElementById('count').textContent='0';
  document.getElementById('energy-bar').style.width='0%';
  document.getElementById('wordcloud').innerHTML='';
  document.getElementById('questions').innerHTML='';
  idx=-1;
  document.getElementById('topic').classList.remove('show');
  document.getElementById('subtitle').classList.remove('show');
  document.getElementById('slide').classList.remove('no-border');
  updateProgress();
  attractToSlide=false;
  fadeAudio(endAudio,0,500);
  fadeAudio(bgAudio,0,500);
  bgStarted=false;
  shapeOffsetX = 0;
  shapeOffsetY = 0;
}

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

// === DRAW ===
function draw(){
  ctx.fillStyle='rgba(10,10,26,0.15)';
  ctx.fillRect(0,0,W,H);

  if(flashAlpha>0){
    ctx.fillStyle=`rgba(0,255,255,${flashAlpha*0.12})`;
    ctx.fillRect(0,0,W,H);
    flashAlpha=Math.max(0,flashAlpha-0.035);
  }

  if(transitioning){
    // === PHASE 1: shape forming ===
    transitionProgress=Math.min(1,transitionProgress+0.01);
    const t=easeInOut(transitionProgress);
    particles.forEach((p,i)=>{
      p.x=transitionFrom[i].x+(transitionTo[i].x-transitionFrom[i].x)*t;
      p.y=transitionFrom[i].y+(transitionTo[i].y-transitionFrom[i].y)*t;
      p.x+=Math.sin(Date.now()*0.002+i*0.5)*1.5*(1-t);
      p.y+=Math.cos(Date.now()*0.002+i*0.5)*1.5*(1-t);
    });
    if(transitionProgress>=1){
      transitioning=false;
      // Snap particles exactly to shape targets
      particles.forEach((p,i)=>{
        p.x=shapeTargets[i].x;
        p.y=shapeTargets[i].y;
        p.vx=0;
        p.vy=0;
      });
    }

 } else if(attractToSlide){
    // Gyroscope shifts the entire shape as a whole
    shapeOffsetX += (forceX * 40 - shapeOffsetX) * 0.05;
    shapeOffsetY += (forceY * 40 - shapeOffsetY) * 0.05;

    particles.forEach((p,i)=>{
      // Target = shape position + gyro offset + tiny per-particle wobble
      const tx = shapeTargets[i].x + p.ox + shapeOffsetX;
      const ty = shapeTargets[i].y + p.oy + shapeOffsetY;

      p.vx += (tx - p.x) * 0.06;
      p.vy += (ty - p.y) * 0.06;

      p.vx += (Math.random()-.5) * 0.05;
      p.vy += (Math.random()-.5) * 0.05;

      p.vx *= 0.88;
      p.vy *= 0.88;
      p.x += p.vx;
      p.y += p.vy;
    });

  } else {
    // === PHASE 0: default float (before first page) ===
    particles.forEach(p=>{
      p.vx+=forceX*0.03;
      p.vy+=forceY*0.03;
      p.vx+=(Math.random()-.5)*0.04;
      p.vy+=(Math.random()-.5)*0.04;
      p.vx*=.97;
      p.vy*=.97;
      p.x+=p.vx;
      p.y+=p.vy;
      if(p.x<0||p.x>W)p.vx*=-1;
      if(p.y<0||p.y>H)p.vy*=-1;
    });
  }

  // Draw particles
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle='rgba(0,255,255,0.7)';
    ctx.fill();
  });

  // Draw connections
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const dx=particles[i].x-particles[j].x;
      const dy=particles[i].y-particles[j].y;
      const d=dx*dx+dy*dy;
      if(d<6000){
        ctx.strokeStyle=`rgba(0,255,255,${.2*(1-d/6000)})`;
        ctx.lineWidth=.4;
        ctx.beginPath();
        ctx.moveTo(particles[i].x,particles[i].y);
        ctx.lineTo(particles[j].x,particles[j].y);
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(draw);
}
draw();

// === KEYBOARD ===
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')next();
  if(e.key==='ArrowLeft'&&idx>0){idx-=2;next();}
  if(e.key===' '){e.preventDefault();triggerShapeTransition();}
  if(e.key==='r'||e.key==='R')reboot();
  if(e.key==='1')set(ref(db,'screenMode'),'wordcloud');
  if(e.key==='2')set(ref(db,'screenMode'),'qa');
  if(e.key==='3')set(ref(db,'screenMode'),'free');
  if(e.key==='0')set(ref(db,'screenMode'),'shake');
});
</script>
</body>
</html>
